name = "mcpgsc"
main = "src/index.ts"
compatibility_date = "2026-10-15"
workers_dev = true

# 02:00 UTC = 09:00 Asia/Bangkok
[triggers]
crons = ["0 2 * * *"]

# Wrangler 4.45+ automatically provisions the named D1 database on deploy.
# Leave database_id absent intentionally; never use placeholder text here.
[[d1_databases]]
binding = "DB"
database_name = "mcpgsc"
