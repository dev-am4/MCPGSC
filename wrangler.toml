name = "mcpgsc"
main = "src/index.ts"
compatibility_date = "2026-10-15"
workers_dev = true

# Preserve runtime variables configured in the Cloudflare dashboard across Git deployments.
keep_vars = true

# Public, non-sensitive runtime configuration is source-controlled so it cannot disappear.
[vars]
APP_URL = "https://mcpgsc.am4-production29.workers.dev"

# Required sensitive runtime bindings. Wrangler validates these exist before a real deploy.
[secrets]
required = [
  "GOOGLE_CLIENT_ID",
  "GOOGLE_CLIENT_SECRET",
  "ALLOWED_EMAILS",
  "SESSION_SECRET",
  "TOKEN_ENCRYPTION_KEY",
  "MCP_API_KEY"
]

# 02:00 UTC = 09:00 Asia/Bangkok
[triggers]
crons = ["0 2 * * *"]

# Wrangler 4.45+ automatically provisions the named D1 database on deploy.
# Leave database_id absent intentionally; never use placeholder text here.
[[d1_databases]]
binding = "DB"
database_name = "mcpgsc"

# Serve the actual optimized PNG files generated for the brand.
[assets]
directory = "./assets"
binding = "ASSETS"
run_worker_first = true
